versao: ridge_v2
data: "2026-09-21"
status: especificacao_revisada

target: pontos_num

benchmark:
  nome: "B2S P0-corrected"
  arquivo: reports/baselines_p0_corrected_folds.csv
  mae: 2.7485
  spearman: 0.2552
  status: referencia_externa

features:
  contagem: "21 features: 15 numericas + 6 one-hot de posicao"
  historico:      [hist_mean, hist_std, hist_n, hist_shrunk_k7]
  recente:        [rec_mean_5, rec_mean_3, rec_std_5, momentum]
  basico:         [basic_mean, basic_rec_5]
  gols_assist:    [ga_per_game, ga_rec_5, ga_shrunk_k7]
  oportunidade:   [entrou_rate, is_cold_start]
  posicao_onehot: [posicao_1, posicao_2, posicao_3, posicao_4, posicao_5, posicao_6]

k_shrink: 7

cold_start:
  quando: "hist_n == 0"
  flag: is_cold_start
  tratamento: "features historicas ficam NaN; imputacao pela media do treino por feature"
  proibido: "usar b0_const para imputar features historicas/recentes/basicas/GA"

janelas_recentes:
  definicao: "ultimas N participacoes (entrou_em_campo=True), nao ultimas N linhas"
  N: [5, 3]
  aplica_a: [rec_mean_5, rec_mean_3, rec_std_5, basic_rec_5, ga_rec_5]

preprocessamento:
  ordem:
    - "separar features numericas e one-hot"
    - "imputar NaN numericos pela media do treino"
    - "StandardScaler fit no treino imputado; aplicar em treino e test"
  onehot:
    - "nao imputar"
    - "nao padronizar"
    - "registrar folds com coluna zero-variancia"

ridge:
  implementacao: "closed-form numpy: w = (X^T X + alpha I)^-1 X^T y_c; intercepto = y_mean"
  grade_alpha: [0.1, 1, 3, 10, 30, 100, 300, 1000]
  selecao: "inner walk-forward dentro do treino externo"
  min_inner_rounds: 3
  desempate: "empate de MAE interno -> menor alpha (min(alphas, key=lambda a: (inner_mean[a], a)))"
  contador_fits: n_ridge_fits

metricas:
  primaria: MAE
  ponderacao: n_test_participantes
  secundarias: [RMSE, Spearman]

criterios_promocao:
  c1: "MAE_Ridge < MAE_B2S - 1e-3"
  c2: ">= 50/76 folds com MAE_Ridge_fold < MAE_B2S_fold - 1e-4"
  c3: "MAE_Ridge < MAE_B2S em 2024, 2025 e 2026 (sem margem adicional)"
  c4: "nenhuma temporada com MAE_Ridge > 1.015 * MAE_B2S"
  c5: "mediana(MAE_Ridge_fold - MAE_B2S_fold) < -1e-3"
  regra_empate: "empate no c1 dentro de 1e-3 -> B2S vence"

decisoes_possiveis: [PROMOTE_RIDGE_V2, KEEP_B2S, INCONCLUSIVE]

integridade:
  canonical: "15be1a317afb940c4ffc0ad0758a034ef0a8438637d58b75265620b47db88db4"
  b2s_folds: "b56c6db440d7628acbbc52bb477e1b4fe81ce3fc87610e5aa0452e2110e6a142"
  harness:   "236b7421ed83860d6921131d708b0508601a8be495ac35f175f91eaefca803a5"
  p0_folds:  "8b4f61851c227d8ee8c2c76aa38f8c6389656bbb8d1109ee909ccce2d77bb689"

artefatos_saida_principais:
  - reports/ridge_v2_folds.csv
  - reports/ridge_v2_alphas.csv
  - reports/ridge_v2_coefficients.csv
  - reports/ridge_v2_summary.md
  - reports/ridge_v2_selection.json
  - reports/ridge_v2_validation.json

artefatos_auxiliares_de_auditoria:
  - reports/ridge_v2_priors_debug.csv   # usado por L6
  - reports/ridge_v2_shrunk_debug.csv   # usado por L10

fora_de_escopo:
  - "Confronto"
  - "status_id"
  - "NDCG"
  - "xG / xA"
  - "embeddings"
  - "pooling entre temporadas"
  - "modelos alternativos"
  - "tuning fora da grade pre-registrada"

decisoes_congeladas:
  k_shrink: 7
  avaliacao: "somente participantes (entrou_em_campo=True)"
  janela_recente: "ultimas N participacoes reais"
  prior_pos: "calculado sobre todo o treino externo; nao usa observacoes do test externo"
  preprocessing: "imputar -> padronizar; one-hot intacto"
  shrinkage: "hist_shrunk_k7 e ga_shrunk_k7 com k=7"
