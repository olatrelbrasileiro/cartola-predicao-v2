metadata:
  etapa: "3.b"
  status: "AUDITORIA_FECHADA"
  data_auditoria: "2026-09-20"
  dataset_periodo: "2024-2026"
  descricao: >
    Registro auditavel da tabela de pontuacao dos scouts Cartola FC,
    com pesos por temporada, para uso no baseline B3 (componente basico).

  fontes:
    - url: "https://ge.globo.com/cartola/noticia/2025/03/17/quanto-vale-a-pontuacao-de-cada-scout-no-cartola.ghtml"
      tipo: "OFICIAL"
      data: "2025-03-17"
      entidade: "GE/Globo"
      titulo: "Quanto vale a pontuacao de cada scout no Cartola?"
    - url: "https://ge.globo.com/cartola/noticia/2025/03/12/cartola-2025-defesa-e-desarme-tem-acrescimo-de-pontuacao-para-a-temporada-confira.ghtml"
      tipo: "OFICIAL"
      data: "2025-03-12"
      entidade: "GE/Globo"
      titulo: "Cartola 2025: defesa e desarme tem acrescimo de pontuacao"
    - url: "https://ge.globo.com/gato-mestre/analises/noticia/2026/04/29/top-10-do-gato-mestre-revela-os-melhores-jogadores-em-media-basica-no-cartola-confira.ghtml"
      tipo: "OFICIAL"
      data: "2026-04-29"
      entidade: "GE/Globo"
      titulo: "Top 10 do Gato Mestre revela os melhores em media basica"

pesos_por_temporada:
